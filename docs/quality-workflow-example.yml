name: Quality Checks

# Copy this file to .github/workflows/quality.yml if you want GitHub Actions checks.

on:
  push:
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run internal link checker
        run: npm run check:links

<!doctype html>
<html><head><meta charset="utf-8"><title>capture</title></head>
<body>
<video id="v" muted playsinline preload="auto" crossorigin="anonymous" src="file:///C:/Users/DMAGS/Downloads/testbook.mp4"></video>
<canvas id="c"></canvas>
<pre id="out">loading</pre>
<script>
(async () => {
  const video = document.getElementById('v');
  const canvas = document.getElementById('c');
  const out = document.getElementById('out');
  const wait = (target, event) => new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('timeout ' + event)), 12000);
    target.addEventListener(event, () => { clearTimeout(timer); resolve(); }, { once: true });
  });
  try {
    video.load();
    await wait(video, 'loadedmetadata');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const duration = video.duration || 1;
    const points = [0.5, 2, 4, 6, 8, 10, 12, 15, 18, 22, 26, 30, 36, 42, 50, 60].filter(t => t < duration - 0.2);
    const frames = [];
    for (const t of points) {
      video.currentTime = t;
      await wait(video, 'seeked');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      frames.push({ t, w: canvas.width, h: canvas.height, data: canvas.toDataURL('image/jpeg', 0.72) });
    }
    out.textContent = JSON.stringify({ duration, frames });
    document.title = 'done';
  } catch (err) {
    out.textContent = JSON.stringify({ error: String(err && err.message || err) });
    document.title = 'error';
  }
})();
</script>
</body></html>

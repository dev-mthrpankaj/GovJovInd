name: Test Static SEO Hydration - UP ANM

on:
  push:
    branches:
      - test/static-seo-hydrator-up-anm
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run isolated UP ANM hydration test
        run: node test-static-seo/test-hydrator.js
      - name: Commit rendered test output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-static-seo/rendered-up-anm-2026.html
          if git diff --cached --quiet; then
            echo "No rendered output changes."
            exit 0
          fi
          git commit -m "Generate isolated UP ANM hydrated HTML"
          git push

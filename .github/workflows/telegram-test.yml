name: Telegram Bot Test

'on':
  workflow_dispatch:

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: >-
          curl --fail --show-error --silent
          --request POST
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}"
          --data-urlencode "text=✅ GovJobUpdates Telegram Bot Connected%0A%0A🚀 Auto update system is ready for GovJobUpdates.com%0A%0A🌐 Website: https://govjobupdates.com%0A%0AThis is a test message from GitHub Actions."
          --data-urlencode "disable_web_page_preview=true"

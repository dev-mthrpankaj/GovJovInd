name: Telegram Bot Test

'on':
  workflow_dispatch:

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test message
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHANNEL_ID;

            if (!token) {
              core.setFailed('TELEGRAM_BOT_TOKEN secret is missing.');
              return;
            }

            if (!chatId) {
              core.setFailed('TELEGRAM_CHANNEL_ID secret is missing.');
              return;
            }

            const meResponse = await fetch(`https://api.telegram.org/bot${token}/getMe`);
            const meData = await meResponse.json().catch(() => ({}));
            console.log('Token bot identity:', JSON.stringify(meData, null, 2));

            if (!meResponse.ok || !meData.ok) {
              core.setFailed(`Bot token test failed: ${meData.description || meResponse.statusText}`);
              return;
            }

            core.notice(`Token belongs to bot: @${meData.result.username}`);
            core.notice(`Target channel id: ${chatId}`);

            const message = [
              '✅ GovJobUpdates Telegram Bot Connected',
              '',
              '🚀 Auto update system is ready for GovJobUpdates.com',
              '',
              '🌐 Website: https://govjobupdates.com',
              '',
              'This is a test message from GitHub Actions.'
            ].join('\n');

            const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: chatId,
                text: message,
                disable_web_page_preview: true
              })
            });

            const data = await response.json().catch(() => ({}));
            console.log('Telegram API response:', JSON.stringify(data, null, 2));

            if (!response.ok || !data.ok) {
              core.setFailed(`Telegram test failed: ${data.description || response.statusText}`);
              return;
            }

            core.notice('Telegram test message sent successfully.');

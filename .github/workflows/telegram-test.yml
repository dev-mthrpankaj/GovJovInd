name: Telegram Bot Test

'on':
  workflow_dispatch:

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set +e
          RESPONSE=$(curl --show-error --silent \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=✅ GovJobUpdates Telegram Bot Connected

🚀 Auto update system is ready for GovJobUpdates.com

🌐 Website: https://govjobupdates.com

This is a test message from GitHub Actions." \
            --data-urlencode "disable_web_page_preview=true")
          STATUS=$?
          echo "Telegram API response:"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
          OK=$?
          if [ "$STATUS" -ne 0 ] || [ "$OK" -ne 0 ]; then
            echo "Telegram test failed. Check bot admin rights, channel id, and token."
            exit 1
          fi
          echo "Telegram test message sent successfully."

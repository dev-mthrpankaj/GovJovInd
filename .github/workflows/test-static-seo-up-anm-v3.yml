name: Test Static SEO Hydration - UP ANM V3
on:
  push:
    branches:
      - test/static-seo-hydrator-up-anm
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static hydration test
        run: node test-static-seo/test-hydrator-v3.js
      - name: Commit rendered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-static-seo/rendered-up-anm-2026.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate isolated UP ANM hydrated HTML v3"
          git push

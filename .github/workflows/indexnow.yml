name: Submit URLs to IndexNow

on:
  workflow_dispatch:
    inputs:
      submit_all:
        description: "Submit every URL across generated sitemaps"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - sitemap.xml
      - sitemap-*.xml
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies if needed
        run: npm install --no-audit --no-fund

      - name: Submit recent sitemap URLs to IndexNow
        if: ${{ github.event.inputs.submit_all != 'true' }}
        run: npm run submit:indexnow

      - name: Submit full sitemap to IndexNow
        if: ${{ github.event.inputs.submit_all == 'true' }}
        run: npm run submit:indexnow -- --all

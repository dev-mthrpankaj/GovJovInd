name: Sync listing data from Google Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync-listing-data:
    runs-on: ubuntu-latest
    env:
      GJU_SHEET_API_URL: "https://script.google.com/macros/s/AKfycbweqlqEKOhfn_PtfRZdu_uH9KAr3226-lbeu-gCF-fLh0lq7EP6yRTDHlPwLgMIHjdn/exec"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static JS data files and cache versions
        run: node scripts/sync-apps-script-to-js.js

      - name: Commit generated data files and cache versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JS/jobs-data.js JS/admitcard-data.js JS/answerkey-data.js JS/results-data.js
          git add HTML/latest-jobs.html HTML/admitcard.html HTML/answer-key.html HTML/results.html

          if git diff --cached --quiet; then
            echo "No listing data changes to commit."
          else
            git commit -m "Sync listing data from Google Sheet"
            git push
          fi

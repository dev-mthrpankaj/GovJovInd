name: Sync listing data from Google Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  sync-listing-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static JS data files
        run: node scripts/sync-apps-script-to-js.js

      - name: Commit generated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JS/jobs-data.js JS/admitcard-data.js JS/answerkey-data.js JS/results-data.js

          if git diff --cached --quiet; then
            echo "No listing data changes to commit."
          else
            git commit -m "Sync listing data from Google Sheet"
            git push
          fi

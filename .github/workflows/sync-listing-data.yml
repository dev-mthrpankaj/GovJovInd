name: Sync listing data from Admin database

# Runs only when you press "Publish to Website" in the admin (workflow_dispatch),
# plus once every night at 00:10 IST so date-based statuses (exam-over, closed...) roll over.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 18 * * *"

permissions:
  contents: write

concurrency:
  group: sync-listing-data-main
  cancel-in-progress: true

jobs:
  sync-listing-data:
    runs-on: ubuntu-latest
    env:
      # Full feed URL incl. key, e.g. https://YOUR-DOMAIN/test/live-test/content-feed.php?key=FEED_KEY
      # Store it as a repository secret named GJU_CONTENT_FEED_URL (never commit it).
      GJU_SHEET_API_URL: ${{ secrets.GJU_CONTENT_FEED_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Rebase on latest main before generating files
        run: git pull --rebase --autostash origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static JS data files and cache versions
        run: node scripts/sync-apps-script-to-js.js

      - name: Hydrate static listing cards into HTML pages
        run: node scripts/hydrate-listing-pages.js --write

      - name: Rebuild site search index from current listings
        run: node scripts/generate-search-index.js

      - name: Commit generated data files, cache versions, and search index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JS/jobs-data.js JS/admitcard-data.js JS/answerkey-data.js JS/results-data.js JS/rank-predictor-exams-data.js
          git add HTML/latest-jobs.html HTML/admitcard.html HTML/answer-key.html HTML/results.html HTML/rank-predictor.html
          git add data/site-search-index.json

          if git diff --cached --quiet; then
            echo "No listing data changes to commit."
          else
            git commit -m "Sync listing data from admin database"
            git pull --rebase --autostash origin main
            git push
          fi

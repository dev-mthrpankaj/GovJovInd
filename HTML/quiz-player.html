<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<title>Starting Quiz | GovJobUpdates</title>
<link rel="icon" href="../Assets/Home Page/favicon.ico">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3fb;font-family:Arial,sans-serif}.player-loader{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:20px;background:#eef3fb}.player-card{width:min(92%,420px);text-align:center;padding:34px 24px;background:#fff;border:1px solid #dbe5f3;border-radius:18px;box-shadow:0 16px 45px rgba(15,35,70,.08)}.spinner{width:34px;height:34px;margin:0 auto 16px;border:4px solid #dbe5f3;border-top-color:#1557d6;border-radius:50%;animation:spin .7s linear infinite}.player-card h1{margin:0 0 7px;font-size:22px;color:#16233b}.player-card p{margin:0;color:#64748b;font-size:14px}@keyframes spin{to{transform:rotate(360deg)}}#quizFrame{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;background:#eef3fb}.ready #quizFrame{opacity:1;pointer-events:auto}.ready .player-loader{display:none}
</style>
</head>
<body>
<div class="player-loader" role="status" aria-live="polite"><div class="player-card"><div class="spinner"></div><h1>Starting your quiz…</h1><p>Loading questions and preparing the test.</p></div></div>
<iframe id="quizFrame" title="GovJobUpdates Quiz"></iframe>
<script>
(function(){
 const params=new URLSearchParams(location.search),quiz=String(params.get('quiz')||'').trim();
 if(!quiz){location.replace('quiz.html');return;}
 const frame=document.getElementById('quizFrame');
 frame.src='quiz-attempt.html?quiz='+encodeURIComponent(quiz);
 function inspect(){
  try{
   const d=frame.contentDocument;if(!d)return false;
   const exam=d.getElementById('examView');
   if(exam&&!exam.classList.contains('hidden')){document.body.classList.add('ready');return true;}
  }catch(e){}
  return false;
 }
 frame.addEventListener('load',function(){if(inspect())return;const timer=setInterval(function(){if(inspect())clearInterval(timer);},40);setTimeout(function(){clearInterval(timer);if(!document.body.classList.contains('ready'))document.body.classList.add('ready');},12000);});
})();
</script>
</body>
</html>

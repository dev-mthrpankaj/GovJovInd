<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Job Details | GovJobUpdates</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="32x32" href="../Assets/Home Page/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../Assets/Home Page/favicon-16x16.png">
  <link rel="shortcut icon" href="../Assets/Home Page/favicon.ico">
  <link rel="stylesheet" href="../CSS/style.css">
  <script>
    (function () {
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var target = "../Job_Details/HTML/job-details.html" + search + hash;
      window.location.replace(target);
    }());
  </script>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo-container">
        <img src="../Assets/Home Page/favicon-96x96.png" alt="GovJobUpdates Logo" class="logo-img" width="46" height="46">
        <a href="../index.html" class="logo">GovJob<span>Updates</span></a>
      </div>
    </div>
  </header>
  <main style="max-width:760px;margin:2rem auto;padding:1rem">
    <section class="job-detail-card" style="background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:1rem;box-shadow:0 8px 24px rgba(15,23,42,.08)">
      <h1>Redirecting to job details...</h1>
      <p>If you are not redirected automatically, open the updated job detail page below.</p>
      <p><a class="btn btn-primary" href="../Job_Details/HTML/job-details.html">Open Job Details</a></p>
    </section>
  </main>
</body>
</html>
